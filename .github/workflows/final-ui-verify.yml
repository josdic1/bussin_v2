name: Final UI verification

on:
  push:
    branches:
      - final-ui-integration-20260929

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git diff --check

      - name: Package tested source
        run: |
          tar             --exclude=.git             --exclude=node_modules             --exclude='*/node_modules'             -czf /tmp/bussin-final-tested.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: bussin-final-tested
          path: /tmp/bussin-final-tested.tar.gz
          if-no-files-found: error
